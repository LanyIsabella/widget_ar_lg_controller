[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lg-ac-controller"
version = "0.1.0"
description = "Controlador desktop para ar-condicionado LG ThinQ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.6.0",
    "thinqconnect==1.0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
desktop = [
    "PySide6>=6.8,<7",
]
build = [
    "PyInstaller>=6.10,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requer PAT e conta LG autorizada; não executado por padrão",
]
